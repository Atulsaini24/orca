# Lint and import-order rules for the Python code (backend/, tools/).
line-length = 200
target-version = "py310"
extend-exclude = [".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E702", "RUF005", "E731", "SIM108", "RUF001", "RUF002", "RUF003", "B905", "E741"]

[lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[lint.isort]
known-first-party = ["orca"]
