name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.6"
      - name: Ruff (Python)
        run: ruff check backend tools --output-format=github
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: ESLint and TypeScript
        working-directory: web
        run: npm run lint && npx tsc -b --noEmit

  test:
    name: Tests (unit, real data, browser)
    # pinned: the locked Playwright (1.57) cannot install Chromium's system dependencies on ubuntu-latest
    # (26.04); move to ubuntu-latest together with a Playwright upgrade that supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - name: Install locked dependencies
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e backend --no-deps
      - name: Cache the prepared NYC TLC data
        id: data
        uses: actions/cache@v4
        with:
          path: |
            backend/data/trips_manhattan.parquet
            backend/artifacts/traffic_manhattan.json
            frontend/data/manhattan/trips.js
          key: trips-2026-09-${{ hashFiles('backend/scripts/prepare_trips.py', 'backend/scripts/download_tlc.py', 'backend/artifacts/streets_manhattan.npz') }}
      - name: Download and prepare real data
        if: steps.data.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          # yellow taxis only in CI (67 MB); the full build adds Uber / Lyft (510 MB)
          python scripts/download_tlc.py --year 2026 --month 9
          python scripts/download_tlc.py --zones
          python scripts/prepare_trips.py --city manhattan
          git -C .. diff --stat -- frontend/src/tlc_data.js backend/artifacts/nyc_traffic_profile.json
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build the home page and the control room
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          python frontend/build.py
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -W ignore::sklearn.exceptions.InconsistentVersionWarning --junitxml=../test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results.xml }

  services:
    name: PostgreSQL ledger and Redis event stream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: orca }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ORCA_TEST_PG: postgresql+psycopg://postgres:orca@localhost:5432/postgres
      ORCA_TEST_REDIS: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: |
          pip install -r backend/requirements-dev.lock "psycopg[binary]==3.2.3" redis==5.0.8
          pip install -e backend --no-deps
      - name: Ledger on PostgreSQL, events on Redis
        working-directory: backend
        run: python -m pytest -q tests/test_orca.py -k "postgres or redis or event_stream"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: orca:ci
          # Manhattan only: Chicago's trip download alone takes about 35 minutes; the image still runs every
          # city (a city without prepared trips runs synthetic demand), and the deploy builds include Chicago
          build-args: CITIES=manhattan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name orca -p 8000:8000 -e ORCA_OPEN_CONTROLS=1 orca:ci
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"demand":"real NYC TLC trip records"'
          curl -sf -o /dev/null http://127.0.0.1:8000/
          curl -sf -o /dev/null http://127.0.0.1:8000/app
          curl -sfI http://127.0.0.1:8000/media/orca-tour.mp4 | grep -qi 'video/mp4'
          docker inspect --format '{{.State.Health.Status}}' orca || true
      - if: failure()
        run: docker logs orca || true

  lock:
    name: Dependency lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install from the lock and re-lock
        run: |
          pip install -r backend/requirements-dev.lock && pip install -e backend --no-deps
          cp backend/requirements.lock /tmp/rt.lock && cp backend/requirements-dev.lock /tmp/dev.lock
          python tools/lock_deps.py
          diff <(grep -v -i colorama /tmp/rt.lock) <(grep -v -i colorama backend/requirements.lock)
          diff <(grep -v -i colorama /tmp/dev.lock) <(grep -v -i colorama backend/requirements-dev.lock)
