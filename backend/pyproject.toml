[project]
name = "orca-dispatch"
version = "0.4.0"
description = "ORCA: real-time dispatch engine with learned ETA, acceptance and demand models"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=14",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "threadpoolctl>=3.2",
  "numba>=0.60",                       # compiled fleet, routing and shared-ride kernels (orca/kernels.py)
]

[project.optional-dependencies]
data = ["pyarrow>=14"]                 # read NYC TLC Parquet files
dev = ["pytest>=8", "requests>=2.31", "matplotlib>=3.8"]
video = ["playwright>=1.45", "imageio-ffmpeg>=0.5", "edge-tts>=7.0", "gTTS>=2.5"]   # tools/make_tour_video.py
lint = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: browser end-to-end tests (Playwright + Chromium); deselect with -m 'not e2e'"]

